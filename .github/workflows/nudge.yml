# Calls /api/cron/nudge every hour, because Vercel's free plan only runs crons once a day.
# Needs two repository secrets: SITE_URL (https://your-site.vercel.app) and CRON_SECRET (the same value as in Vercel).
name: Hourly reminders
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the reminders that are due
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Add SITE_URL and CRON_SECRET as repository secrets to switch hourly reminders on."; exit 0; fi
          curl -fsS --max-time 240 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/nudge"
