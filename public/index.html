<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benchwork</title>
<meta name="description" content="Benchwork: a free training plan from zero to AI engineer. Placement, a dated path, lessons, in-browser coding exercises, quizzes, projects with peer review, accountability partners and a cohort board.">
<meta name="theme-color" content="#0e1726">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Benchwork">
<meta property="og:title" content="Benchwork: from zero to AI engineer">
<meta property="og:description" content="A free, dated plan with lessons, coding exercises that run in your browser, real projects and an accountability partner.">
<meta property="og:image" content="/og-cert.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Benchwork: a learning platform for builders. Dark masthead, bright working surfaces,
   coral for the one action that matters, amber for rewards, a dark code workspace. */
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#eef1f5;--line:#e1e5eb;--line-2:#cdd3dc;
  --ink:#0e1726;--muted:#566173;--faint:#8a94a6;
  --night:#0e1726;--night-2:#16223a;--night-ink:#eef2f8;--night-muted:#a3afc4;
  --accent:#c93c1a;--accent-2:#ad3214;--accent-hi:#ff7a52;--accent-text:#c93c1a;--accent-soft:#fff0eb;--accent-ink:#fff;
  --xp:#f5a524;--xp-soft:#fff6e3;--ok:#13a05a;--ok-soft:#e8f7ef;--fail:#d92d20;--fail-soft:#fdeceb;--warn:#a15c00;
  --p1:#2563d0;--p2:#13a05a;--p3:#f0532f;--p4:#0e9f9e;
  --learn:#2f7bed;--build:#13a05a;--project:#c93c1a;--review:#64748b;
  --code-bg:#0f1625;--code-ink:#e6edf7;--code-line:#22304a;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;--r-sm:8px;--shadow:0 1px 2px rgb(16 24 40 / .05),0 1px 3px rgb(16 24 40 / .08);--shadow-lg:0 12px 32px -8px rgb(16 24 40 / .18);
  --ease:cubic-bezier(.2,.8,.2,1);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1120;--surface:#111a2c;--surface-2:#17223a;--line:#22304a;--line-2:#2e3e5c;--ink:#e8edf5;--muted:#a0abc0;--faint:#93a0b8;
  --accent-soft:#3a1d16;--xp-soft:#3a2c10;--ok-soft:#0f2e20;--fail-soft:#3a1615;--warn:#f0b04a;--ok:#3ccf83;--fail:#ff7a6e;--learn:#6aa3ff;--review:#94a3b8;--project:#ff8a66;--accent-text:#ff8a66;
  --shadow:0 1px 2px rgb(0 0 0 / .3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1120;--surface:#111a2c;--surface-2:#17223a;--line:#22304a;--line-2:#2e3e5c;--ink:#e8edf5;--muted:#a0abc0;--faint:#93a0b8;
  --accent-soft:#3a1d16;--xp-soft:#3a2c10;--ok-soft:#0f2e20;--fail-soft:#3a1615;--warn:#f0b04a;--ok:#3ccf83;--fail:#ff7a6e;--learn:#6aa3ff;--review:#94a3b8;--project:#ff8a66;--accent-text:#ff8a66;--shadow:0 1px 2px rgb(0 0 0 / .3);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-2) transparent;scroll-padding-top:90px}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;caret-color:var(--accent);accent-color:var(--accent)}
::selection{background:var(--accent);color:#fff}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:var(--line-2)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(28px,3vw,38px);line-height:1.1;font-weight:750}
h2{font-size:20px;line-height:1.25;font-weight:700;margin:0 0 12px}
h3{font-size:16px;line-height:1.3;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 12px}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}.small{font-size:14.5px}.xs{font-size:13px}
code,pre,kbd{font-family:var(--mono);font-size:.86em}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);padding:.05em .35em;border-radius:5px;white-space:nowrap}
.lede{font-size:17.5px;line-height:1.55;color:var(--muted);max-width:64ch;margin:8px 0 0}
.lede b{color:var(--ink)}

/* masthead */
.mast{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--night);color:var(--night-ink);box-shadow:0 1px 0 rgb(255 255 255 / .06)}
.mast-in{max-width:1240px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:26px;height:62px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em;white-space:nowrap}
.logo svg{flex:none}
#nav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--night-muted);font-weight:600;font-size:15px;white-space:nowrap;transition:color .15s var(--ease),background-color .15s var(--ease)}
#nav a svg{width:17px;height:17px;flex:none;opacity:.85}
#nav a:hover{color:#fff;background:rgb(255 255 255 / .06)}
#nav a[aria-current="page"]{color:#fff;background:rgb(255 255 255 / .1)}
#me{display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgb(255 255 255 / .08);font-weight:700;font-size:13.5px;color:#fff;text-decoration:none}
.chip svg{flex:none}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:14px;text-decoration:none;font-family:var(--display)}
.solo #nav,.solo #me{display:none}
/* section tabs */
.subnav{display:flex;gap:4px;margin:-6px 0 26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav a{padding:10px 14px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s var(--ease),border-color .15s var(--ease)}
.subnav a:hover{color:var(--ink)}
.subnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
/* account menu */
.acct{position:relative}.acct summary{list-style:none;cursor:pointer}.acct summary::-webkit-details-marker{display:none}
.acct summary:focus-visible{outline:2px solid #fff;outline-offset:2px}
.acct-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:220px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgb(14 23 38 / .35);padding:6px;display:grid;z-index:30}
.acct-who{padding:10px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:grid;gap:2px;white-space:normal}.acct-who span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acct-menu a,.acct-menu button{display:block;text-align:left;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font:inherit;font-size:14.5px;font-weight:600;background:none;border:0;cursor:pointer}
.acct-menu a:hover,.acct-menu button:hover,.acct-menu a[aria-current="page"]{background:var(--surface-2)}
@media (max-width:820px){
  .mast-in{height:56px;padding:0 16px;gap:12px}
  #me{margin-left:auto}#me .chip.lvl{display:none}
  /* the five sections become a tab bar at the bottom of the screen */
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--night);border-top:1px solid rgb(255 255 255 / .08);padding:4px 4px calc(4px + env(safe-area-inset-bottom));overflow:visible}
  #nav a{flex-direction:column;gap:3px;padding:7px 2px 6px;font-size:11.5px;justify-content:center;border-radius:10px}
  #nav a svg{width:21px;height:21px}
  #nav a[aria-current="page"]{background:none;color:#fff}#nav a[aria-current="page"] svg{color:var(--accent-hi);opacity:1}
  .subnav{margin:-4px -16px 20px;padding:0 8px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* page */
main{max-width:1240px;margin:0 auto;padding:32px 28px 120px}
main:focus{outline:0}
@media (max-width:820px){main{padding:20px 16px calc(110px + env(safe-area-inset-bottom))}}
.narrow{max-width:760px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:grid;gap:16px}
.sec{margin-top:36px}
.sec>h2:first-child{margin-bottom:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.cols>aside{position:sticky;top:86px;display:grid;gap:16px}
.cols>aside.flat{position:static}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}.cols>aside{position:static}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:650}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.card.pad-lg{padding:24px}
.card.tight{padding:14px 16px}
.card>h2,.card>h3{margin-top:0}
.label{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 18px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font:700 15px/1.2 var(--body);text-decoration:none;cursor:pointer;box-shadow:0 1px 0 rgb(0 0 0 / .08),inset 0 -2px 0 rgb(0 0 0 / .12);transition:transform .12s var(--ease),background-color .15s var(--ease),box-shadow .15s var(--ease),opacity .15s}
@media (hover:hover){.btn:hover{background:var(--accent-2)}}
.btn:active{transform:scale(.97)}
.btn.line{background:var(--surface);color:var(--ink);border-color:var(--line-2);box-shadow:var(--shadow)}
@media (hover:hover){.btn.line:hover{background:var(--surface-2);border-color:var(--faint)}}
.btn.dark{background:var(--night);color:#fff}
@media (hover:hover){.btn.dark:hover{background:var(--night-2)}}
.btn.lg{min-height:50px;padding:12px 24px;font-size:16.5px;border-radius:12px}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;cursor:pointer}
.link:hover{text-decoration-color:currentColor}
.link.accent{color:var(--accent);font-weight:650}

/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.tag.k-learn{--c:var(--learn)}.tag.k-build{--c:var(--build)}.tag.k-project{--c:var(--project)}.tag.k-review{--c:var(--review)}
.tag.start{--c:var(--ink)}.tag.fast{--c:var(--learn)}.tag.testout{--c:var(--ok)}.tag.done{--c:var(--ok);background:var(--ok-soft);color:var(--ok)}
.tag.behind{--c:var(--warn);background:var(--xp-soft);color:var(--warn)}.tag.skip{--c:var(--line-2)}
.tag.p1{--c:var(--p1)}.tag.p2{--c:var(--p2)}.tag.p3{--c:var(--p3)}.tag.p4{--c:var(--p4)}

/* progress */
.bar{display:block;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px;transform-origin:left;transform:scaleX(var(--f,0));transition:transform .6s var(--ease)}
.bar.ok i{--c:var(--ok)}.bar.xp i{--c:var(--xp)}.bar.thin{height:6px}
.ring{--s:56px;width:var(--s);height:var(--s);flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:var(--surface-2)}.ring .fg{stroke:var(--c,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}

/* home hero */
.hero{background:var(--night);color:var(--night-ink);border-radius:18px;padding:28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;border:44px solid rgb(201 60 26 / .22);pointer-events:none}
.hero h1{color:#fff}
.hero .muted{color:var(--night-muted)}
.hero .up{font-size:14px;color:var(--night-muted);margin-bottom:6px}
.hero .next{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2;margin:4px 0 16px;color:#fff}
.hero .bar{background:rgb(255 255 255 / .12)}
.countdown{position:relative;z-index:1;display:grid;gap:12px;align-content:start}
.cd{background:rgb(255 255 255 / .06);border:1px solid rgb(255 255 255 / .08);border-radius:14px;padding:14px 16px}
.cd .big{font-family:var(--display);font-size:38px;font-weight:800;line-height:1;color:#fff;letter-spacing:-.03em}
.cd .big small{font-size:16px;font-weight:600;color:var(--night-muted);margin-left:6px;letter-spacing:0}
.cd .sub{font-size:13.5px;color:var(--night-muted);margin-top:6px}
.cd .ahead{color:#5fe0a0}.cd .late{color:#ffb38f}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);padding:22px}}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.stat{display:flex;align-items:center;gap:14px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.05}
.stat .v small{font-size:14px;color:var(--muted);font-weight:600;font-family:var(--body)}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink)}
.ico.xp{background:var(--xp-soft);color:var(--xp)}.ico.fire{background:var(--accent-soft);color:var(--accent-text)}.ico.ok{background:var(--ok-soft);color:var(--ok)}.ico.blue{background:#e8f1fe;color:var(--p1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ico.blue{background:#13284a}}
:root[data-theme="dark"] .ico.blue{background:#13284a}
@media (max-width:900px){.stats{grid-template-columns:1fr 1fr}}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{position:relative;padding:10px 10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;min-height:96px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day .dname{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700}
.day .hrs{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;margin-top:4px}
.day .hrs small{font-size:13px;margin-left:1px;font-weight:600;color:var(--muted)}
.day .kind{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--c,var(--muted))}
.day.k-learn{--c:var(--learn)}.day.k-build{--c:var(--build)}.day.k-project{--c:var(--project)}.day.k-review{--c:var(--review)}
.day.rest{background:transparent;border-style:dashed}.day.rest .hrs{color:var(--faint)}
.day .got{font-size:12px;color:var(--ok);font-weight:700}
.day .fill{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0));transition:transform .5s var(--ease)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.today .dname span:last-child{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day.today .dname span:last-child,:root:not([data-theme="light"]) .link.accent{color:var(--accent-hi)}}
:root[data-theme="dark"] .day.today .dname span:last-child,:root[data-theme="dark"] .link.accent{color:var(--accent-hi)}
.day.past:not(.today) .hrs{color:var(--faint)}
@starting-style{.day.just .fill{transform:scaleX(var(--f0,0))}}
@media (max-width:820px){.strip{gap:4px}.day{padding:7px 5px 10px;min-height:80px;border-radius:9px}.day .hrs{font-size:18px}.day .kind{font-size:11px}.day .dname{font-size:11px}.day .dname span+span{display:none}.day .got{font-size:11px}}

/* the path */
.path{position:relative;display:grid;gap:10px}
.node{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid transparent;text-decoration:none;color:inherit;transition:transform .15s var(--ease),box-shadow .15s var(--ease),border-color .15s var(--ease)}
@media (hover:hover){a.node:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}}
.node .dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted);font-family:var(--display);font-weight:800;font-size:16px;position:relative}
.node.done .dot{background:var(--ok);color:#fff}
.node.cur{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.node.cur .dot{background:var(--accent);color:#fff}
.node.cur .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:.35;animation:pulse-ring 2.4s var(--ease) infinite}
@keyframes pulse-ring{0%{transform:scale(.9);opacity:.5}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.node.skip{opacity:.6}
.node .t{font-weight:700;font-size:15.5px}
.node .s{font-size:13px;color:var(--muted)}
.node .bar{margin-top:6px}
.path-phase{margin:18px 0 2px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.path-phase::after{content:"";flex:1;height:1px;background:var(--line)}

/* quests */
.quest{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--xp-soft);color:var(--xp)}
.quest.done .qi{background:var(--ok-soft);color:var(--ok)}
.quest .qt{font-weight:650;font-size:14.5px}
.quest .qx{font-size:12.5px;font-weight:800;color:var(--xp)}
.quest.done .qx{color:var(--ok)}

/* partner */
.partner{display:grid;gap:10px}
.pp{display:flex;align-items:center;gap:12px}
.pp .avatar{width:40px;height:40px;font-size:16px}
.pp.p2 .avatar{background:var(--p1)}
.msgs-mini{display:grid;gap:6px;max-height:160px;overflow:auto}
.msgs-mini div{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:7px 10px}
.msgs-mini b{font-weight:700}

/* lists */
.rl{list-style:none;margin:0;padding:0}
.rl>li{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:14px;align-items:center}
.rl>li:last-child{border-bottom:0}
.rl>li .grow{flex:1;min-width:0}
.rl .num{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-size:13px;color:var(--muted)}
.rl .num.ok{background:var(--ok);color:#fff}
.rl a.ttl{font-weight:700;text-decoration:none}.rl a.ttl:hover{text-decoration:underline}
.state{flex:none;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600}
.state.ok{color:var(--ok)}
.checks{list-style:none;margin:0;padding:0}
.checks li{border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
.checks input{width:19px;height:19px;margin-top:2px;flex:none}
.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}

/* tables */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.r{text-align:right}
.tbl tr.me-row td{background:var(--accent-soft)}

/* plan grid */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 12px}
.plan-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table.plan{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
.plan th{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.plan td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle}
.plan td.wk{width:100px;white-space:nowrap}.plan td.wk b{font-family:var(--display);font-size:16px;margin-right:6px}.plan td.wk span{color:var(--muted);font-size:12.5px}
.plan td.crs{width:230px;font-size:13.5px;line-height:1.3}.plan td.crs a{display:block;text-decoration:none;font-weight:700}.plan td.crs a:hover{text-decoration:underline}
.plan td.tot{text-align:right;white-space:nowrap;width:80px;font-weight:700}
.c{position:relative;height:30px;border-radius:7px;background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px}
.c i{position:absolute;inset:0;background:var(--c);transform-origin:left;transform:scaleX(var(--f,0))}
.c em{position:relative;font-style:normal;font-weight:800;color:var(--muted)}
.c.k-learn{--c:var(--learn)}.c.k-build{--c:var(--build)}.c.k-project{--c:var(--project)}.c.k-review{--c:var(--review)}
.c.rest{background:transparent;border:1px dashed var(--line)}
.c.part em b{background:var(--surface);padding:0 4px;border-radius:4px;color:var(--ink)}
.c.full em{color:#fff}
.plan tr.now td{background:var(--accent-soft)}
.plan tr.focus td{background:var(--xp-soft)}
.plan tr.done-wk td.wk b{color:var(--faint)}
.plan tr.ms td{padding:12px 10px;font-weight:700}
.finish{display:flex;align-items:center;gap:14px}
.hl{background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px}

/* course */
.banner{border-radius:18px;padding:26px;background:var(--night);color:var(--night-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0%,color-mix(in srgb,var(--pc,var(--accent)) 35%,transparent),transparent 70%);pointer-events:none}
.banner>*{position:relative}
.banner h1{color:#fff}
.banner .lede{color:var(--night-muted)}
.banner .meta{color:var(--night-muted)}.banner .meta b{color:#fff}
.banner .meta a{color:#fff}
.banner .tag{background:rgb(255 255 255 / .1);color:#fff}
.banner .ring .tr{stroke:rgb(255 255 255 / .12)}
.banner .ringwrap{text-align:center}
.banner .ringwrap b{display:block;font-family:var(--display);font-size:20px;margin-top:-62px;height:62px;line-height:62px;color:#fff}
.banner .ringwrap span{font-size:12.5px;color:var(--night-muted)}
@media (max-width:700px){.banner{grid-template-columns:1fr;padding:20px}}
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:12px}.crumb a{color:var(--muted)}
.banner .crumb,.banner .crumb a{color:var(--night-muted)}

/* lesson reader */
.prose{max-width:70ch;font-size:17px;line-height:1.7}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}.prose li{margin:5px 0}
.prose pre{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:16px 18px;overflow-x:auto;margin:0 0 18px;font-size:14px;line-height:1.6}
.prose pre code{background:none;border:0;padding:0;white-space:pre;font-size:inherit;color:inherit}
.prose h3{margin:18px 0 8px}
.toc{list-style:none;margin:0;padding:0;font-size:14.5px}
.toc a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--muted)}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.toc a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.toc .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px;font-weight:800;flex:none}
.toc .ok .n,.toc a.ok .n{background:var(--ok);color:#fff}

/* exercise workspace */
.ex{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start;margin-top:18px}
@media (max-width:1000px){.ex{grid-template-columns:minmax(0,1fr)}}
.editor{position:relative;border-radius:14px;background:var(--code-bg);overflow:hidden;box-shadow:var(--shadow-lg)}
.editor .bar-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--code-line);font-size:12.5px;color:#93a1bb;font-family:var(--mono)}
.editor .bar-top .dots{display:inline-flex;gap:6px;margin-right:10px}.editor .bar-top .dots i{width:10px;height:10px;border-radius:50%;background:#2a3955}
.editor textarea{display:block;width:100%;min-height:320px;resize:vertical;border:0;outline:0;border-radius:0;background:transparent;color:var(--code-ink);font:14px/1.65 var(--mono);padding:16px 18px;tab-size:4;white-space:pre;overflow:auto;caret-color:var(--accent)}
.editor textarea:focus{outline:0}
.editor:focus-within{box-shadow:0 0 0 2px var(--accent),var(--shadow-lg)}
.console{margin-top:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.console .head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.results ul{list-style:none;margin:0;padding:0}
.results li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
.results li:last-child{border-bottom:0}
.results li svg{flex:none;margin-top:3px}
.results li.pass svg{color:var(--ok)}.results li.fail svg{color:var(--fail)}
.results .why{display:block;color:var(--muted);font-size:13px;font-family:var(--mono);white-space:pre-wrap;word-break:break-word}
.out{background:var(--code-bg);color:var(--code-ink);padding:12px 16px;font:13px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.out.err{background:var(--fail-soft);color:var(--ink)}
.verdict{font-family:var(--display);font-weight:800;font-size:17px;margin:0}
.verdict.pass{color:var(--ok)}.verdict.fail{color:var(--fail)}
.hints{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.hints li{padding:10px 12px;border-radius:10px;background:var(--xp-soft);font-size:14.5px}
.sqltbl{margin:0;font:13px var(--mono);border-collapse:collapse;width:100%}
.sqltbl th,.sqltbl td{border-bottom:1px solid var(--line);padding:6px 16px;text-align:left}

/* quiz and practice */
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qt{font-weight:700;margin:0 0 12px;max-width:72ch;font-size:16.5px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
@media (hover:hover){.opt:hover{border-color:var(--line-2);background:var(--surface-2)}}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:3px 0 0;width:17px;height:17px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--fail);background:var(--fail-soft)}
.mark{display:block;font-size:12.5px;font-weight:800;margin-top:2px}
.opt.right .mark{color:var(--ok)}.opt.wrong .mark{color:var(--fail)}
.expl{color:var(--muted);font-size:14.5px;margin:10px 0 0;max-width:72ch}
.score{font-family:var(--display);font-size:48px;font-weight:800;line-height:1}
.popt{display:block;width:100%;text-align:left;padding:15px 18px;margin:0 0 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 16px/1.4 var(--body);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:border-color .15s var(--ease),transform .12s var(--ease),box-shadow .12s var(--ease)}
@media (hover:hover){.popt:hover{border-color:var(--line-2)}}
.popt:active{transform:translateY(2px);box-shadow:none}
.popt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 2px 0 var(--ok)}
.popt.wrong{border-color:var(--fail);background:var(--fail-soft);box-shadow:0 2px 0 var(--fail)}
.popt.unsure{color:var(--muted);border-style:dashed;box-shadow:none}
.popt[disabled]{cursor:default;transform:none}
.pbar{display:flex;gap:4px;margin-bottom:20px}.pbar i{flex:1;height:6px;background:var(--surface-2);border-radius:999px}.pbar i.on{background:var(--accent)}
.pq{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.3;margin:6px 0 22px}

/* tools rating */
.rate{display:grid;gap:10px}
.rate .rrow{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.rate .rrow>b{font-weight:700}.rate .rrow>b small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:10px;background:var(--surface-2)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 4px;font-size:14px;font-weight:600;border-radius:7px;color:var(--muted);transition:background-color .15s var(--ease),color .15s var(--ease)}
@media (hover:hover){.seg label:hover span{color:var(--ink)}}
.seg input:checked+span{background:var(--surface);color:var(--ink);font-weight:800;box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:620px){.rate .rrow{grid-template-columns:1fr;gap:8px}.seg span{font-size:12.5px;padding:8px 2px}}
.dbar{display:grid;grid-template-columns:180px 1fr 120px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dbar:last-child{border-bottom:0}
@media (max-width:620px){.dbar{grid-template-columns:1fr 110px}.dbar .bar{grid-column:1/-1;order:3}}

/* forms */
.field{margin-bottom:16px}
.field>label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=time],input:not([type]),input[type=number],input[type=date],input[type=url],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;min-height:44px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:90px;resize:vertical}
input[readonly]{background:var(--surface-2);color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{font-size:14px;color:var(--fail);margin:6px 0 0;font-weight:700}
fieldset{border:0;padding:0;margin:0 0 18px}legend{font-weight:700;font-size:14px;margin-bottom:8px}
.choice{display:grid;gap:10px}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);transition:border-color .15s var(--ease)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:3px;width:17px;height:17px;flex:none}
.notice{border-radius:12px;background:var(--xp-soft);padding:12px 16px;margin:16px 0;font-size:15px}

/* sign-up */
.auth{min-height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);width:100vw;margin:-32px 0 -120px calc(50% - 50vw)}
.auth-side{background:var(--night);color:var(--night-ink);padding:56px 56px 48px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:28px}
.auth-side::after{content:"";position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;border-radius:50%;border:60px solid rgb(201 60 26 / .2)}
.auth-side h1{color:#fff;font-size:clamp(34px,4vw,52px);line-height:1.03;letter-spacing:-.03em;max-width:13ch}
.auth-side h1 em{font-style:normal;color:var(--accent-hi)}
.auth-side .lede{color:var(--night-muted);margin-top:14px}
.props{display:grid;gap:14px;max-width:460px;position:relative;z-index:1}
.prop{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.prop .ico{width:40px;height:40px;background:rgb(255 255 255 / .08);color:#fff}
.prop b{display:block;color:#fff;font-size:15.5px}.prop span{font-size:14px;color:var(--night-muted)}
.preview{position:relative;z-index:1;background:rgb(255 255 255 / .05);border:1px solid rgb(255 255 255 / .1);border-radius:16px;padding:14px;max-width:460px;display:grid;gap:8px}
.preview .pv{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;font-size:14px}
.preview .pv i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:rgb(255 255 255 / .1)}
.preview .pv.d i{background:var(--ok);color:#fff}.preview .pv.cur i{background:var(--accent);color:#fff}
.preview .pv span{color:var(--night-muted);font-size:12.5px}
.auth-main{display:flex;align-items:center;justify-content:center;padding:48px 40px}
.auth-card{width:100%;max-width:460px}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--faint)}
.steps span i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--surface-2);font-size:12px}
.steps span.on{color:var(--ink)}.steps span.on i{background:var(--accent);color:#fff}
@media (max-width:980px){.auth{grid-template-columns:1fr;margin:-20px 0 -96px calc(50% - 50vw)}.auth-side{padding:32px 22px}.auth-main{padding:28px 18px 40px;order:-1}.auth-side .preview{display:none}}

/* tutor */
.tutor{margin-top:24px}
.tutor .msgs{display:grid;gap:12px;margin:12px 0 14px}
.tutor .msg{font-size:15px;line-height:1.6;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.tutor .msg b{display:block;font-size:12.5px;color:var(--muted);font-weight:800;margin-bottom:2px}
.tutor .msg.you{background:var(--accent-soft)}
.tutor .msg p:last-child{margin:0}
.tutor .msg pre{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:13px}
.tutor form{display:flex;gap:8px;align-items:flex-end}
.tutor textarea{min-height:46px;height:46px}
.thinking{color:var(--muted)}

/* reward pop */
.reward{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:60;background:var(--night);color:#fff;border-radius:16px;padding:14px 18px;min-width:280px;max-width:92vw;box-shadow:var(--shadow-lg);display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;animation:pop .35s var(--ease)}
.reward .ico{background:var(--xp);color:var(--night)}
.reward b{display:block;font-family:var(--display);font-size:17px}
.reward span{font-size:13.5px;color:var(--night-muted)}
.reward .bar{margin-top:8px;background:rgb(255 255 255 / .14)}
.reward.out{opacity:0;transform:translate(-50%,-6px);transition:opacity .2s,transform .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px) scale(.96)}}

/* certificates */
.cert{max-width:900px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lg);margin-top:20px;background:#fff;color:#0e1726}
.cert svg{display:block;width:100%;height:auto}

/* misc */
.empty{padding:28px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);text-align:center}
.empty h3{color:var(--ink)}
.sk{background:var(--surface-2);border-radius:10px;animation:skp 1.4s ease-in-out infinite}
@keyframes skp{50%{opacity:.55}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;z-index:50;box-shadow:var(--shadow-lg);animation:tin .2s var(--ease)}
.toast.out{opacity:0;transition:opacity .16s}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}
.weeks{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:170px;border-bottom:1px solid var(--line-2);margin:16px 0 30px}
.weeks .wk{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.weeks .wk i{display:block;background:var(--line-2);border-radius:6px 6px 0 0;min-height:2px}
.weeks .wk.hit i{background:var(--ok)}
.weeks .wk.cur i{background:var(--accent)}
.weeks em{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-style:normal;font-size:11.5px;color:var(--muted)}
.weeks .target{position:absolute;left:0;right:0;border-top:2px dashed var(--xp);z-index:1}
.weeks .target span{position:absolute;right:0;top:-22px;font-size:12px;font-weight:700;color:var(--warn);background:var(--surface);padding:0 4px}
@media (max-width:620px){.weeks em{display:none}}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#fff;padding:8px 12px;z-index:30;border-radius:8px}
.skip:focus{left:12px}

/* welcome moment and tour */
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}
.welcome-modal{position:fixed;inset:0;z-index:80;background:rgb(10 17 32 / .55);display:grid;place-items:center;padding:20px;animation:fadein .25s var(--ease)}
.wm-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);padding:32px 28px 26px;max-width:460px;width:100%;text-align:center;animation:popin .45s var(--ease)}
.wm-card h2{font-size:28px;margin:4px 0 10px}
.wm-badge{width:72px;height:72px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ok);color:#fff;margin-bottom:14px;box-shadow:0 0 0 8px var(--ok-soft)}
.wm-xp{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:18px}
@keyframes fadein{from{opacity:0}}
@keyframes popin{from{opacity:0;transform:translateY(10px) scale(.96)}}
.tour-dim{position:fixed;inset:0;z-index:70;background:transparent}
.tour-ring{position:fixed;z-index:71;border-radius:12px;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgb(10 17 32 / .5);pointer-events:none;transition:all .25s var(--ease)}
.tour-pop{position:fixed;z-index:72;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);padding:16px 18px;animation:popin .25s var(--ease)}
.tour-pop h3{font-size:18px}
/* sign-in extras */
.btn.google{display:flex;align-items:center;justify-content:center;gap:10px}.btn.google svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--faint);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.notice.bad{background:var(--fail-soft);border-color:var(--fail)}
.auth-card.sent .wm-badge{margin:0 0 18px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}.toggle:first-of-type{border-top:0}
.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.days{display:flex;flex-wrap:wrap;gap:6px}.days label{display:inline-flex}.days input{position:absolute;opacity:0;pointer-events:none}.days span{padding:8px 12px;border:1px solid var(--line-2);border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}.days input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}.days input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 18px}.kpi{border-left:3px solid var(--line-2);padding:2px 0 2px 14px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-family:"Bricolage Grotesque",Figtree,sans-serif}.kpi span{font-size:13px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 140px 40px;gap:10px;align-items:center;font-size:14px;padding:5px 0}.bar-row i{display:block;height:8px;border-radius:4px;background:var(--accent)}.bar-row .track{background:var(--surface-2);border-radius:4px}
.sharebox{display:flex;gap:8px;margin:10px 0}.sharebox input{flex:1;min-width:0}
/* interview room */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.line.on-dark{background:rgb(255 255 255 / .06);color:#fff;border-color:rgb(255 255 255 / .22);box-shadow:none}
@media (hover:hover){.btn.line.on-dark:hover{background:rgb(255 255 255 / .12);border-color:rgb(255 255 255 / .4)}}
hr.soft{border:0;border-top:1px solid var(--line);margin:14px 0}
.iv-list{display:grid;margin-top:8px}
.iv-row{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.iv-row:first-child{border-top:0}@media (hover:hover){.iv-row:hover b{text-decoration:underline;text-underline-offset:3px}}
.iv-num{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.iv-trend{display:flex;align-items:flex-end;gap:8px;height:96px;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.iv-trend span{flex:1;max-width:48px;height:var(--h);background:var(--accent);border-radius:6px 6px 0 0;position:relative;min-height:6px}
.iv-trend b{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:12px}
.iv-steps{margin:0;padding-left:20px;display:grid;gap:10px}.iv-steps li{padding-left:4px}
.iv-findrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:12px;align-items:end}.iv-findrow .field{margin:0}
.iv-remote{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;min-height:44px}.iv-remote input{width:18px;height:18px;accent-color:var(--accent)}
.iv-results{display:grid;gap:12px}.iv-job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.iv-ul{margin:6px 0 0;padding-left:18px;display:grid;gap:6px}.iv-comp{margin:6px 0 0;padding-left:20px;display:grid;gap:10px}
.iv-decode h3{margin:20px 0 4px;font-size:15px}
.iv-formats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.iv-format{position:relative;display:block;cursor:pointer}.iv-format input{position:absolute;opacity:0}
.iv-format>span{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;height:100%}
.iv-format input:checked+span{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.iv-format input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.iv-setrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.iv-jd{max-height:520px;overflow:auto;margin-top:10px;line-height:1.55}
.iv-runhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.iv-prog{display:grid;gap:6px;min-width:200px}
.iv-room{display:grid;gap:14px;margin-top:22px;max-width:780px}
.iv-msg{border-radius:16px;padding:14px 16px;max-width:88%;line-height:1.55}.iv-msg p{margin:0 0 8px}.iv-msg p:last-child{margin:0}
.iv-msg .who{display:block;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin-bottom:4px}
.iv-msg.them{background:var(--surface);border:1px solid var(--line);justify-self:start}
.iv-msg.you{background:var(--night);color:var(--night-ink);justify-self:end}.iv-msg.you .who{color:var(--night-muted)}
.iv-answer{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.iv-answer textarea{border:0;padding:4px;min-height:140px;resize:vertical;background:transparent}.iv-answer textarea:focus{box-shadow:none;outline:none}
.iv-self{max-width:780px}
.iv-score-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.iv-big{position:relative;display:grid;place-items:center;width:96px;height:96px}.iv-big .ring{position:absolute;inset:0}
.iv-big b{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:30px;line-height:1;margin-top:-6px}.iv-big .xs{position:absolute;bottom:22px;color:var(--night-muted)}
.iv-bars{display:grid;gap:10px;margin-top:8px}.iv-bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(80px,1fr) 34px;gap:12px;align-items:center}
.iv-bar>span:first-child{display:grid}
.iv-q{border-top:1px solid var(--line);padding:12px 0}.iv-q summary{display:grid;grid-template-columns:minmax(0,1fr) auto 40px;gap:10px;align-items:center;cursor:pointer;list-style:none}
.iv-q summary::-webkit-details-marker{display:none}
.iv-better{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.iv-priority{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.iv-stories{display:grid;gap:12px}
@media (max-width:820px){.iv-findrow{grid-template-columns:1fr 1fr}.iv-setrow{grid-template-columns:1fr}.iv-msg{max-width:100%}.iv-bar{grid-template-columns:minmax(0,1fr) 70px 30px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
